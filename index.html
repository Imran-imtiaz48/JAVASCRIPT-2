<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="index.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>To-Do List</h1>
    </header>

    <section aria-label="Add new task">
      <form id="task-form">
        <label for="input">Enter a task:</label>
        <input id="input" type="text" name="task" required />
        <button type="submit">Add Task</button>
      </form>
    </section>

    <section id="task-container" aria-label="Task list">
      <!-- Task items will be dynamically inserted here -->
    </section>
  </main>
</body>
</html>
